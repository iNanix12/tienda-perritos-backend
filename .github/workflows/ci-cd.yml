name: CI/CD Backend

on:
  push:
    branches: [main]

env:
  AWS_REGION: us-east-1
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_uri: ${{ steps.build.outputs.image_uri }}
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login en Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build y push de la imagen
        id: build
        env:
          REPO_URI: ${{ secrets.ECR_REPOSITORY_URI }}
        run: |
          docker build -t $REPO_URI:$IMAGE_TAG -t $REPO_URI:latest .
          docker push $REPO_URI:$IMAGE_TAG
          docker push $REPO_URI:latest
          echo "image_uri=$REPO_URI:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login en Amazon ECR (para que la EC2 pueda hacer pull)
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Desplegar en EC2 backend por SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          REPO_URI: ${{ secrets.ECR_REPOSITORY_URI }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          FRONTEND_ORIGIN: ${{ secrets.FRONTEND_ORIGIN }}
        with:
          host: ${{ secrets.EC2_BACKEND_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          envs: REPO_URI,AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,AWS_SESSION_TOKEN,DB_HOST,DB_PASSWORD,FRONTEND_ORIGIN
          script: |
            aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin $(echo $REPO_URI | cut -d'/' -f1)
            docker pull $REPO_URI:latest
            docker stop tienda-backend || true
            docker rm tienda-backend || true
            docker run -d \
              --name tienda-backend \
              --restart unless-stopped \
              -p 3001:3001 \
              -e DB_HOST="$DB_HOST" \
              -e DB_USER=root \
              -e DB_PASSWORD="$DB_PASSWORD" \
              -e DB_NAME=tienda_perritos \
              -e DB_PORT=3306 \
              -e CORS_ORIGIN="$FRONTEND_ORIGIN" \
              $REPO_URI:latest
            docker image prune -f
